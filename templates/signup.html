<!doctype html>
<html lang="en">
<head>
    <title>UWA Study Buddy | Sign Up</title>

    <!-- Using the Bootstrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Using the CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light bg-gradient">
    {% include 'navbar.html' %}

    <!-- Sign up page content -->
    <div class="container-fluid p-5 my-5 bg-container container-text">
        <div class="row">
            <div class="col text-center">
                <h1 class="display-5">Sign Up</h1>
                <p class="lead">Create your UWA Study Buddy profile to get started.</p>
            </div>
        </div>

        <!-- Sign up box -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card-style card-padding">
                    <h5 class="text-center mb-4">Enter your details below</h5>

                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('sign_up.sign_up') }}">
                        
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">  <!-- CSRF protection -->

                        <h5 class="mb-3">Personal Details</h5>
                        <div class="row g-3">
                            <!-- First name -->
                            <div class="col-md-6">
                                <label for="firstname" class="form-label">First name</label>
                                <input type="text" class="form-control" name="firstname" id="validationDefault01" required>
                            </div>

                            <!-- Last name -->
                            <div class="col-md-6">
                                <label for="lastname" class="form-label">Last name</label>
                                <input type="text" class="form-control" name="lastname" id="validationDefault02" required>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" id="validationDefault03" required>
                            </div>

                            <!-- Birthday -->
                            <div class="col-md-6">
                                <label for="birthday" class="form-label">Birthday</label>
                                <input type="date" class="form-control" name="birthday" id="validationDefault04" required>
                            </div>
                        </div>

                        <hr>

                        <h5 class="mb-3">Account Details</h5>
                        <div class="row g-3">
                            <!-- UWA Student ID -->
                            <div class="col-md-4">
                                <label for="student_id" class="form-label">UWA Student ID</label>
                                <input type="text" class="form-control" name="student_id" id="validationDefault05" required>
                            </div>

                            <!-- Username -->
                            <div class="col-md-4">
                                <label for="createusername" class="form-label">Username</label>
                                <input type="text" class="form-control" name="username" id="validationDefault06" required>
                            </div>

                            <!-- Password -->
                            <div class="col-md-4">
                                <label for="createpassword" class="form-label">Password</label>
                                <input type="text" class="form-control" name="password" id="validationDefault07" required>
                            </div>
                        </div>

                        <hr>

                        <h5 class="mb-3">Study Details</h5>
                        <div class="row g-3">
                            <!-- Course -->
                            <div class="col-md-6">
                                <label for="course" class="form-label">Course</label>
                                <input type="text" class="form-control" name="course" id="validationDefault08" required>
                            </div>

                            <!-- Graduation year -->
                            <div class="col-md-6">
                                <label for="graduation" class="form-label">Graduation year</label>
                                <input type="text" class="form-control" name="graduation" id="validationDefault09" required>
                            </div>
                        </div>

                        <!-- Create button -->
                        <button type="submit" class="btn btn-primary w-100 mt-4">Save and Create profile</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Login option -->
        <p class="text-center mt-4 mb-0">
            Already have a profile? <a href="{{ url_for('login_page.login_page') }}">Login Here!</a>
        </p>
    </div>
</body>
</html>
