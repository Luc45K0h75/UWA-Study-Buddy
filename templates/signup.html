<!doctype html>
<html>
<head>
    <title>UWA Study Buddy | Sign-Up </title>

    <!-- Using the Bootstrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Using the CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light bg-gradient">

    {% include 'navbar.html' %}

    <!-- Creating the Sign-up box-->
    <div class="container my-5">

        <div class= "row justify-content-center">

            <div class= "col-sm-8 col-md-6 col-lg-4">

                <div class="card mt-5">
                    <h5 class= "card-header text-center">Sign-Up</h5>
                    <div class ="card-body">
                        <h5 class="card-title text-center">Create your profile to get started :)</h5>
                        <form>

                            <!-- First name -->
                            <div class="mb-4">
                                <label for="firstname" class="form-label">Enter your first name:</label>
                                <input type="text" class="form-control" name="firstname" id="validationDefault01" required>
                            </div>

                            <!-- Last name -->
                            <div class="mb-4">
                                <label for="lastname" class="form-label">Enter your last name:</label>
                                <input type="text" class="form-control" name="lastname" id="validationDefault02" required>
                            </div>

                            <!-- Email -->
                            <div class="mb-4">
                                <label for="email" class="form-label">Enter your email:</label>
                                <input type="email" class="form-control" name="email" id="validationDefault03" required>
                            </div>

                            <!-- Birthday -->
                            <div class="mb-4">
                                <label for="birthday" class="form-label">Enter your birthday:</label>
                                <input type="date" class="form-control" name="birthday" id="validationDefault04" required>
                            </div>

                            <!-- UWA Student ID (primary key) -->
                            <div class="mb-4">
                                <label for="student_id" class="form-label">Enter your UWA Student ID:</label>
                                <input type="text" class="form-control" name="student_id" id="validationDefault05" required>
                            </div>

                            <!-- Username -->
                            <div class="mb-4">
                                <label for="createusername" class="form-label">Create your user name:</label>
                                <input type="text" class="form-control" name="username" id="validationDefault06" required>
                            </div>

                            <!-- Password -->
                            <div class="mb-4">
                                <label for="createpassword" class="form-label">Create your password:</label>
                                <input type="text" class="form-control" name="password" id="validationDefault07" required>
                            </div>

                            <!-- Course -->
                            <div class="mb-4">
                                <label for="course" class="form-label">What course are you studying?</label>
                                <input type="text" class="form-control" name="course" id="validationDefault08" required>
                            </div>

                            <!-- Graduation year -->
                            <div class="mb-4">
                                <label for="graduation" class="form-label">What year do you graduate?</label>
                                <input type="text" class="form-control" name="graduation" id="validationDefault09" required>
                            </div>

                            <!-- Create button -->
                            <button type="submit" class="btn btn-primary w-100">Save and Create profile</button>


                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Login option -->
    <p class="text-center mt-3 mb-0">
        Already have a profile? <a href="{{ url_for('login_page') }}">Login Here!</a> 
    </p>

</body>
</html>
