<!doctype html>
<html>
<head>
    <title>UWA Study Buddy | Login </title>

    <!-- Using the Bootstrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Using the CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light bg-gradient">

    {% include 'navbar.html' %}

 <!-- Creating the login box-->
    <div class="container my-5">

        <div class= "row justify-content-center">

            <div class= "col-sm-8 col-md-6 col-lg-4">

                <div class="card mt-5">
                    <h5 class= "card-header text-center">Login</h5>
                    <div class ="card-body">
                        <h5 class="card-title text-center">Welcome Back :)</h5>
                        <form>

                            <!-- Username -->
                            <div class="mb-4">
                                <label for="username" class="form-label">Username:</label>
                                <input type="text" class="form-control" name="username" id="validationDefault01" required>
                            </div>

                            <!-- Password -->
                            <div class="mb-4">
                                <label for="password" class="form-label">Password:</label>
                                <input type="text" class="form-control" name="password" id="validationDefault02" required>
                            </div>

                            <!-- Login button -->
                            <button class="btn btn-primary w-100">Login</button>


                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Signup option -->
    <p class="text-center mt-3 mb-0">
        New to UWA Study Buddy? <a href="{{ url_for('sign_up') }}">Sign Up Here!</a>   <!-- Fixed the connection to the signup page -->
    </p>

</body>
</html>
