<!doctype html>
<html lang="en">
<head>
    <title>UWA Study Buddy | Login</title>

    <!-- Using the Bootstrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Using the CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light bg-gradient">
    {% include 'navbar.html' %}

    <!-- Login page content -->
    <div class="container-fluid p-5 my-5 bg-container container-text">
        <div class="row">
            <div class="col text-center">
                <h1 class="display-5">Login</h1>
                <p class="lead">Welcome back to UWA Study Buddy.</p>
            </div>
        </div>

        <!-- Login box -->
        <div class="row justify-content-center">
            <div class="col-sm-8 col-md-6 col-lg-4">
                <div class="card-style card-padding">
                    <h5 class="text-center mb-4">Enter your details below</h5>

                    <form method="POST" action="{{ url_for('login_page') }}">
                        <!-- Username -->
                        <div class="mb-4">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" id="username" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="text" class="form-control" name="password" id="password" required>
                        </div>

                        <!-- Login button -->
                        <button class="btn btn-primary w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>

    <!-- Signup option -->
    <p class="text-center mt-3 mb-0">
        New to UWA Study Buddy? <a href="{{ url_for('sign_up') }}">Sign Up Here!</a>   <!-- Fixed the connection to the signup page -->
    </p>

</body>
</html>
