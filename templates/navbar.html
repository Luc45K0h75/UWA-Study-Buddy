        <div class="container-fluid">
            <!-- UWA Study Budy Logo-->
            <a class="navbar-brand" href="#">UWA Study Buddy</a>
            <!-- List of elements on the navbar -->
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <!-- Put you links in double quotes after href-->
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index.index') }}">Home</a>
                    </li>
                    <li class="nav-item">

            </div>

        <!-- Login/logout button -->
         {% if current_user.is_authenticated %}  <!-- Using flask-login, if user is logged in it will come up as logout button, otherwise just as a login button-->
         <button class="login-button" onclick="window.location.href='{{ url_for('view_profile') }}'">
            <i class="bi bi-person-circle fs-5"></i>

         <button class="login-button" onclick="window.location.href='{{ url_for('logout') }}'">
            Logout
         </button>

        {% else %}
         <button class="login-button" onclick="window.location.href='{{ url_for('login_page') }}'">Login</button>
